<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite's Guardian | TOS & Privacy Policy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding-top: 80px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .button {
            padding: 14px 25px;
            border: 1px solid #fff;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: 0.2s;
        }

        .button:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Fortnite's Guardian TOS & Privacy Policy</h1>

        <div class="buttons">
            <a class="button" href="TOS.html">Terms of Service</a>
            <a class="button" href="Privacy.html">Privacy Policy</a>
        </div>
    </div>

</body>
</html>
